<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B2B5E"/>
      <stop offset="1" stop-color="#0B8A8F"/>
    </linearGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBE3A4"/>
      <stop offset="1" stop-color="#EDC56F"/>
    </linearGradient>
    <linearGradient id="mound" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFEDBD"/>
      <stop offset="1" stop-color="#E3B55A"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.30"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#001018" flood-opacity="0.45"/>
    </filter>
    <clipPath id="inner">
      <polygon points="512,412 724,530 512,648 300,530"/>
    </clipPath>
  </defs>

  <!-- macOS icon plate -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)" filter="url(#shadow)"/>

  <!-- crescent moon (Artemis) -->
  <path d="M318 218 a70 70 0 1 0 62 104 a56 56 0 1 1 -62 -104z" fill="#FFF3C4"/>
  <circle cx="452" cy="236" r="6" fill="#FFF3C4" opacity=".8"/>
  <circle cx="706" cy="262" r="5" fill="#FFF3C4" opacity=".6"/>
  <circle cx="770" cy="352" r="4" fill="#FFF3C4" opacity=".5"/>

  <!-- sandbox -->
  <g filter="url(#soft)">
    <!-- outer walls -->
    <polygon points="212,530 512,698 512,790 212,622" fill="#B5662B"/>
    <polygon points="512,698 812,530 812,622 512,790" fill="#8E4A1C"/>
    <!-- rim -->
    <polygon points="512,362 812,530 512,698 212,530" fill="#E39A4E"/>
    <!-- inside back walls -->
    <polygon points="512,412 724,530 512,648 300,530" fill="#7A3F18"/>
    <polygon points="512,412 300,530 300,570 512,452" fill="#9A5322" clip-path="url(#inner)"/>
    <!-- sand surface, sunk below rim -->
    <polygon points="512,446 724,564 512,682 300,564" fill="url(#sand)" clip-path="url(#inner)"/>
  </g>

  <!-- shovel planted in the mound -->
  <g transform="rotate(14 560 420)">
    <rect x="548" y="250" width="24" height="230" rx="12" fill="#FF6B5E"/>
    <rect x="520" y="232" width="80" height="26" rx="13" fill="#FF6B5E"/>
    <rect x="548" y="250" width="9" height="230" rx="4.5" fill="#FF9A8F" opacity=".7"/>
  </g>
  <!-- mound -->
  <path d="M388 566 C420 470 480 446 520 452 C566 458 606 496 624 566 C590 596 420 596 388 566z" fill="url(#mound)"/>
  <path d="M410 566 C440 500 480 474 512 474" fill="none" stroke="#FFF7DC" stroke-width="8" stroke-linecap="round" opacity=".7"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
